[package]
authors     = ["magic-akari <akari.ccino@gmail.com>"]
description = "A WASM based PHP Formatter"
edition     = "2024"
homepage    = "https://github.com/wasm-fmt/mago_fmt"
keywords    = ["wasm", "mago", "PHP", "formatter"]
license     = "MIT OR Apache-2.0"
name        = "mago_fmt"
readme      = "README.md"
repository  = "https://github.com/wasm-fmt/mago_fmt"
version     = "1.44.0"

[dependencies]
bridge          = { package = "wasm-fmt-fdk", version = "=0.1.0" }
mago-allocator   = "1.43.0"
mago-formatter   = { version = "1.43.0", features = ["serde"] }
mago-php-version = "1.43.0"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"


[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
pretty_assertions = "1"


[profile.release]
codegen-units = 1
debug         = false     # set to `true` for debug information
lto           = true
opt-level     = 2
panic         = "abort"   # Let it crash and force ourselves to write safe Rust.
strip         = "symbols" # set to `false` for debug information
